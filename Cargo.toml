[package]
name = "wiferry"
version = "0.2.0-alpha.2"
edition = "2024"
rust-version = "1.98.1"
description = "Auditable local-network file delivery with a browser-only receiver"
license = "MIT"
repository = "https://github.com/SidUParis/wiferry"
keywords = ["file-transfer", "lan", "qr-code", "local-first"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3.6"
axum = { version = "0.8.9", features = ["multipart", "macros"] }
base64 = "0.23.1"
bytes = "1"
clap = { version = "4.6.6", features = ["derive"] }
getrandom = "0.4.3"
if-addrs = "0.15.0"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rust-embed = { version = "8.12.0", features = ["deterministic-timestamps", "mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# tinyvec 1.13.0 fails to import vec! in its alloc-only configuration.
tinyvec = { version = "=1.12.0", features = ["alloc"] }
unicode-normalization = "0.1.25"
webbrowser = "1.2.4"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
